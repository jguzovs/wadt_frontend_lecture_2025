<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Animation Example</title>

    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.8/dist/cerulean/bootstrap.min.css" rel="stylesheet">

    <style>
        #buttonAnimate {
            background-color: #655b00;
            color: white;
        }
        #animatedCard {
            position: absolute;
            top: 150px;
            left: 0;
            width: 20rem;
            transition: all 0.3s ease;
        }
        p {
            cursor: pointer;
        }
    </style>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script>
        $(document).ready(function(){
            $("#buttonAnimate").click(function(){
                $("#animatedCard").animate({
                    left: '250px',
                    opacity: '0.5',
                    height: '+=50px',
                    width: '+=50px'
                });
            });

            $("#buttonReverse").click(function(){
                $("#animatedCard").animate({
                    left: '0px',
                    opacity: '1',
                    height: '-=50px',
                    width: '-=50px'
                });
            });

            $("p").hover(function(){
                $("#animatedCard").hide();
            });
            $("#showDiv").click(function(){
                $("#animatedCard").show();
            });
        });
    </script>
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">My Animation Project (Example of using Bootstrap element, in this case nav bar)</a>
        </div>
    </nav>

    <div class="container text-center py-5">
        <h2 class="mb-4 text-primary">Bootstrap Card Animation Example</h2>

        <div class="d-flex justify-content-center gap-3 mb-4">
            <button id="buttonAnimate" class="btn">Animate Card</button>
            <button id="buttonReverse" class="btn btn-warning">Reverse Animation</button>
            <button id="showDiv" class="btn btn-success">Show Card</button>
        </div>

        <p class="p-3 bg-info text-white rounded w-50 mx-auto">
            Hover here to hide the card
        </p>

        <div id="animatedCard" class="card shadow mx-auto">
            <div class="card-header bg-secondary text-white">Bootstrap card element</div>
            <div class="card-body">
                <p class="card-text">
                    This example shows how a <strong>Bootstrap card</strong> can be animated
                    using <strong>jQuery</strong>, just like a div!  
                </p>
            </div>
        </div>
    </div>
</body>
</html>
